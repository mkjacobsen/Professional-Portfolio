[build-system]
requires = ["setuptools>=68", "wheel"]
build_backend = "setuptools.build_meta"

[project]
name = "tensor-anomaly"
version = "0.2.0"
description = "IoT sensor anomaly detection via CP (PARAFAC) tensor decomposition"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "tensorly>=0.8",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]